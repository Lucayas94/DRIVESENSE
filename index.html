<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <!-- Responsive mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>DRIVESENSE — Optimisation IA</title>

  <!-- ═══════════════════════════════════════
       STYLES GLOBAUX DRIVESENSE
       → Rouchy : ajoutez vos composants dans cette section CSS
       ═══════════════════════════════════════ -->
  <style>
    /* variables de design DRIVESENSE ── */
    :root {
      --ds-bg:           #0D1117;
      --ds-surface:      #161B22;
      --ds-surface-alt:  #1C2128;
      --ds-border:       #30363D;
      --ds-accent:       #00C9A7;
      --ds-accent-glow:  rgba(0, 201, 167, 0.25);
      --ds-danger:       #FF4444;
      --ds-warning:      #FF8C00;
      --ds-text:         #E6EDF3;
      --ds-text-muted:   #8B949E;
      --ds-radius:       12px;
      --ds-shadow:       0 4px 24px rgba(0,0,0,0.4);
      --panel-width:     340px;
      --header-h:        60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--ds-bg);
      color: var(--ds-text);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ─── HEADER ─── */
    header {
      height: var(--header-h);
      background: var(--ds-surface);
      border-bottom: 1px solid var(--ds-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
      z-index: 100;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-logo svg {
      width: 28px;
      height: 28px;
    }

    .header-logo span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--ds-accent);
    }

    .header-badge {
      background: var(--ds-accent);
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
    }

    /* ─── LAYOUT PRINCIPAL ─── */
    .app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    /* ─── PANNEAU LATÉRAL ─── */
    .side-panel {
      width: var(--panel-width);
      background: var(--ds-surface);
      border-right: 1px solid var(--ds-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      z-index: 10;
    }

    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--ds-border);
    }

    .panel-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--ds-text-muted);
      margin-bottom: 10px;
    }

    /* ─── BOUTONS D'ACTION ─── */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 16px;
      border: none;
      border-radius: var(--ds-radius);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    #btn-start-trip {
      background: var(--ds-accent);
      color: #000;
    }

    #btn-start-trip:hover:not(:disabled) {
      background: #00e6be;
      box-shadow: 0 0 16px var(--ds-accent-glow);
    }

    #btn-stop-trip {
      background: transparent;
      color: var(--ds-danger);
      border: 1px solid var(--ds-danger);
      margin-top: 8px;
    }

    #btn-stop-trip:hover:not(:disabled) {
      background: rgba(255,68,68,0.1);
    }

    .btn--disabled, .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    .btn-secondary {
      background: var(--ds-surface-alt);
      color: var(--ds-text);
      border: 1px solid var(--ds-border);
      padding: 10px;
      font-size: 12px;
    }

    .btn-secondary:hover {
      background: var(--ds-border);
    }

    /* ─── STATISTIQUES DE ROUTE ─── */
    #route-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .stat-item {
      background: var(--ds-surface-alt);
      border: 1px solid var(--ds-border);
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }

    .stat-icon { font-size: 16px; display: block; margin-bottom: 2px; }
    .stat-value { font-size: 13px; font-weight: 700; color: var(--ds-accent); display: block; }
    .stat-label { font-size: 10px; color: var(--ds-text-muted); }

    /* ─── LISTE DES ARRÊTS ─── */
    #stop-list {
      overflow-y: auto;
      flex: 1;
      padding: 8px;
    }

    #stop-list::-webkit-scrollbar { width: 4px; }
    #stop-list::-webkit-scrollbar-track { background: transparent; }
    #stop-list::-webkit-scrollbar-thumb { background: var(--ds-border); border-radius: 4px; }

    .stop-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--ds-surface-alt);
      border: 1px solid var(--ds-border);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
      border-left-width: 3px;
    }

    .stop-item.priority--haute   { border-left-color: var(--ds-danger);  }
    .stop-item.priority--normale { border-left-color: var(--ds-warning); }
    .stop-item.priority--basse   { border-left-color: var(--ds-accent);  }

    .stop-number {
      width: 26px;
      height: 26px;
      background: var(--ds-border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .stop-details { flex: 1; overflow: hidden; }
    .stop-name    { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stop-address { font-size: 11px; color: var(--ds-text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
    .stop-meta    { font-size: 10px; color: var(--ds-text-muted); margin-top: 3px; }
    .stop-priority { color: var(--ds-warning); font-weight: 700; }

    .stop-action {
      width: 30px;
      height: 30px;
      background: transparent;
      border: 1px solid var(--ds-border);
      border-radius: 50%;
      color: var(--ds-accent);
      font-size: 14px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }

    .stop-action:hover {
      background: var(--ds-accent);
      color: #000;
      border-color: var(--ds-accent);
    }

    /* ─── CARTE GOOGLE MAPS ─── */
    .map-wrapper {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* Boutons flottants sur la carte */
    .map-controls {
      position: absolute;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 5;
    }

    .map-fab {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      color: var(--ds-text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--ds-shadow);
      transition: all 0.15s;
    }

    .map-fab:hover { background: var(--ds-accent); color: #000; border-color: var(--ds-accent); }

    /* ─── OVERLAY DE CHARGEMENT ─── */
    #loading-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(13,17,23,0.85);
      z-index: 999;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--ds-border);
      border-top-color: var(--ds-accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loading-text {
      font-size: 14px;
      color: var(--ds-text-muted);
    }

    /* ─── TOAST NOTIFICATIONS ─── */
    #toast-notification {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--ds-surface);
      border: 1px solid var(--ds-border);
      border-radius: 24px;
      padding: 10px 20px;
      font-size: 13px;
      font-weight: 500;
      z-index: 1000;
      white-space: nowrap;
      box-shadow: var(--ds-shadow);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #toast-notification.toast--visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #toast-notification.toast--success { border-color: var(--ds-accent); color: var(--ds-accent); }
    #toast-notification.toast--warning { border-color: var(--ds-warning); color: var(--ds-warning); }
    #toast-notification.toast--error   { border-color: var(--ds-danger);  color: var(--ds-danger);  }

    /* ════════════════════════════════════
       RESPONSIVE MOBILE (< 768px)
       → Arioty : l'UI s'adapte en colonne
       ════════════════════════════════════ */
    @media (max-width: 768px) {
      .app-layout { flex-direction: column; }

      .side-panel {
        width: 100%;
        height: auto;
        max-height: 45dvh;
        border-right: none;
        border-bottom: 1px solid var(--ds-border);
        overflow-y: auto;
      }

      #stop-list { max-height: 200px; }

      .action-row { grid-template-columns: 1fr 1fr; }

      .map-wrapper { flex: 1; min-height: 200px; }

      .map-controls { bottom: 80px; }

      #toast-notification { width: calc(100% - 32px); text-align: center; white-space: normal; }
    }
  </style>
</head>

<body>

  <!-- ═══════════════════════════════════
       HEADER
       ═══════════════════════════════════ -->
  <header>
    <div class="header-logo">
      <!-- Logo SVG DRIVESENSE -->
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="13" stroke="#00C9A7" stroke-width="2"/>
        <path d="M8 14 L14 8 L20 14 L14 20 Z" fill="#00C9A7" opacity="0.3"/>
        <circle cx="14" cy="14" r="4" fill="#00C9A7"/>
        <path d="M14 4 L14 8 M14 20 L14 24 M4 14 L8 14 M20 14 L24 14" stroke="#00C9A7" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span>DRIVESENSE</span>
    </div>
    <!-- Badge : nombre de livraisons du jour -->
    <span class="header-badge"><span id="delivery-count">0</span> livraisons</span>
  </header>

  <!-- ═══════════════════════════════════
       LAYOUT PRINCIPAL : panneau + carte
       ═══════════════════════════════════ -->
  <div class="app-layout">

    <!-- ─── PANNEAU LATÉRAL GAUCHE ─── -->
    <aside class="side-panel">

      <!-- Boutons de contrôle du trajet -->
      <div class="panel-section">
        <div class="panel-title">Contrôle du trajet</div>
        <!--
          btn-start-trip → déclenche startTrip() dans script.js
          btn-stop-trip  → déclenche stopTrip() dans script.js
        -->
        <button class="btn" id="btn-start-trip">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M3 2.5l10 5.5-10 5.5V2.5z"/>
          </svg>
          Démarrer le trajet
        </button>
        <button class="btn" id="btn-stop-trip" disabled>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="3" y="3" width="10" height="10" rx="1"/>
          </svg>
          Arrêter le trajet
        </button>
        <div class="action-row">
          <button class="btn btn-secondary" id="btn-recenter">📍 Recentrer</button>
          <button class="btn btn-secondary" id="btn-refresh-deliveries">🔄 Actualiser</button>
        </div>
      </div>

      <!-- Métriques de l'itinéraire (remplies dynamiquement par JS) -->
      <div class="panel-section">
        <div class="panel-title">Itinéraire optimisé</div>
        <!--
          #route-stats est mis à jour par updateRouteStats() dans script.js
        -->
        <div id="route-stats">
          <div style="color: var(--ds-text-muted); font-size: 12px; text-align:center; padding: 8px;">
            Lancez le trajet pour voir les statistiques
          </div>
        </div>
      </div>

      <!-- Liste ordonnée des arrêts (remplie dynamiquement par JS) -->
      <div class="panel-title" style="padding: 10px 16px 4px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; color: var(--ds-text-muted);">
        Arrêts de livraison
      </div>
      <!--
        #stop-list est peuplé par displayStopList() dans script.js
        Chaque bouton ✓ appelle markDelivered(id)
      -->
      <div id="stop-list">
        <div style="color: var(--ds-text-muted); font-size: 12px; text-align:center; padding: 20px 16px;">
          ⏳ Chargement des livraisons...
        </div>
      </div>

    </aside>

    <!-- ─── CARTE GOOGLE MAPS ─── -->
    <div class="map-wrapper">
      <!--
        #map → div cible de new google.maps.Map() dans script.js
        Ne JAMAIS changer cet id sans mettre à jour initMap()
      -->
      <div id="map"></div>

      <!-- Boutons flottants sur la carte -->
      <div class="map-controls">
        <button class="map-fab" id="btn-recenter" title="Recentrer sur ma position">📍</button>
      </div>
    </div>

  </div>

  <!-- ═══════════════════════════════════
       OVERLAY DE CHARGEMENT
       Contrôlé par setLoadingState() dans script.js
       ═══════════════════════════════════ -->
  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="loading-text">Initialisation...</div>
  </div>

  <!-- ═══════════════════════════════════
       SCRIPTS
       ═══════════════════════════════════ -->

  <!--
    🔑 GOOGLE MAPS API
    → La clé doit avoir les APIs suivantes activées :
        • Maps JavaScript API
        • Directions API
        • Geocoding API (optionnel)
    → callback=initMap appelle automatiquement votre fonction d'init.
    → Équipe : ne commitez JAMAIS la clé API en dur.
      Utilisez une variable d'environnement ou un proxy backend.
  -->
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDpXLzP2SJphSAaxh36GvqTaOANanNtsTk&callback=initMap&libraries=places&v=weekly&language=fr&region=FR"
    defer
    async
  ></script>

  <!-- Script DRIVESENSE principal -->
  <script src="script.js"></script>

</body>
</html>
